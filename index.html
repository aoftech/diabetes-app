<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Metabolic Cockpit - Diabetes Tracker</title>
  
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-512.png" type="image/png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cockpit Header -->
  <header class="cockpit-header">
    <div class="brand">
      <span class="status-indicator live"></span>
      <h1 class="brand-title">METABOLIC COCKPIT</h1>
    </div>
    <div class="header-actions">
      <!-- ปุ่มเปิดคู่มือพร้อมพิมพ์ A4 -->
      <a href="patient_guide.html" target="_blank" class="icon-round-btn" title="คู่มือผู้ป่วยและการพิมพ์" style="text-decoration: none;">📄</a>
      <button type="button" id="toggle-settings-btn" class="icon-round-btn" title="ตั้งค่าสูตรแพทย์">⚙️</button>
      <button type="button" id="export-csv-btn" class="icon-round-btn" title="ส่งออก CSV">📥</button>
    </div>
  </header>

  <!-- Rx Modal Settings Panel -->
  <div id="settings-panel" class="settings-drawer hidden">
    <div class="settings-card">
      <div class="settings-header">
        <h3>📋 คำสั่งแพทย์ประจำตัว (Prescription Profile)</h3>
        <button type="button" id="close-settings-btn" class="close-btn">&times;</button>
      </div>
      
      <div class="settings-body">
        <div class="input-grid">
          <div class="field-item">
            <label>🌅 ขนาดยาเช้าตามสั่ง (U)</label>
            <input type="number" id="setting-morning-dose" min="0" step="0.5" placeholder="เช่น 14">
          </div>
          <div class="field-item">
            <label>🌇 ขนาดยาเย็นตามสั่ง (U)</label>
            <input type="number" id="setting-evening-dose" min="0" step="0.5" placeholder="เช่น 8">
          </div>
          <div class="field-item">
            <label>🎯 ค่าน้ำตาลเป้าหมาย (mg/dL)</label>
            <input type="number" id="setting-target" min="60" max="250" placeholder="110">
          </div>
          <div class="field-item">
            <label>📉 ISF (1U ลดได้กี่ mg/dL)</label>
            <input type="number" id="setting-isf" min="1" placeholder="40">
          </div>
          <div class="field-item">
            <label>🍞 ICR (1U คุมคาร์บกี่ g)</label>
            <input type="number" id="setting-icr" min="1" placeholder="15">
          </div>
        </div>
        <button type="button" id="save-settings-btn" class="primary-btn mt-3">💾 บันทึกแผนคำสั่งแพทย์</button>
      </div>
    </div>
  </div>

  <main class="cockpit-viewport">
    
    <!-- Dial Gauge Widget -->
    <section class="gauge-section">
      <div class="gauge-wrapper">
        <svg viewBox="0 0 200 115" class="semicircle-gauge">
          <path class="gauge-track" d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke-width="16" stroke-linecap="round"/>
          <path id="gauge-fill" class="gauge-progress" d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke-width="16" stroke-linecap="round"/>
          <line id="gauge-needle" x1="100" y1="100" x2="100" y2="28" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
          <circle cx="100" cy="100" r="7" fill="#38bdf8"/>
        </svg>
        
        <div class="gauge-value-display">
          <span id="display-glucose" class="digit">--</span>
          <span class="unit">mg/dL</span>
        </div>
        <div id="gauge-status" class="gauge-status-badge status-normal">พร้อมรับข้อมูล</div>
      </div>

      <!-- Time In Range Segment Bar -->
      <div class="tir-container">
        <div class="tir-meta">
          <span>Time-In-Range (ประวัติรวม)</span>
          <span id="tir-percent">0% ในเกณฑ์</span>
        </div>
        <div class="tir-bar">
          <div id="tir-low" class="tir-seg seg-low" style="width: 0%"></div>
          <div id="tir-target" class="tir-seg seg-target" style="width: 0%"></div>
          <div id="tir-high" class="tir-seg seg-high" style="width: 0%"></div>
        </div>
      </div>
    </section>

    <!-- Quick Pilot Form -->
    <section class="pilot-form-card">
      <form id="glucose-form" autocomplete="off">
        <input type="hidden" id="edit-index" value="-1">
        <input type="hidden" id="meal-time" value="morning">
        <input type="hidden" id="symptom-val" value="สดชื่น">

        <!-- Pills: Meal Selection -->
        <div class="form-row-group">
          <label class="group-label">ช่วงเวลาและจังหวะยา</label>
          <div class="pills-container" id="meal-pills">
            <button type="button" class="pill-btn active" data-val="morning">🌅 ก่อนมื้อเช้า (ฉีดยา)</button>
            <button type="button" class="pill-btn" data-val="evening">🌇 ก่อนมื้อเย็น (ฉีดยา)</button>
            <button type="button" class="pill-btn" data-val="post-meal">⏱️ หลังอาหาร 2h</button>
            <button type="button" class="pill-btn" data-val="bedtime">🌙 ก่อนนอน</button>
          </div>
        </div>

        <!-- Numeric Metrics Input -->
        <div class="metrics-grid">
          <div class="metric-input-card">
            <span class="metric-icon">🩸</span>
            <label for="glucose-val">ระดับน้ำตาล</label>
            <div class="input-wrap">
              <input type="number" id="glucose-val" required min="20" max="600" placeholder="105">
              <span class="sub-unit">mg/dL</span>
            </div>
          </div>

          <div class="metric-input-card highlight-border">
            <span class="metric-icon">💉</span>
            <div class="metric-header-wrap">
              <label for="insulin-val">ฉีดจริง (Actual)</label>
              <small id="rx-hint-label" class="rx-pill">คำสั่งหมอ 0 U</small>
            </div>
            <div class="input-wrap">
              <input type="number" id="insulin-val" min="0" max="100" step="0.5" placeholder="0">
              <span class="sub-unit">Unit</span>
            </div>
            <div id="expected-hint" class="expected-calc-text">คาดการณ์: -</div>
          </div>

          <div class="metric-input-card">
            <span class="metric-icon">🍞</span>
            <label for="carbs-val">ปริมาณคาร์บ</label>
            <div class="input-wrap">
              <input type="number" id="carbs-val" min="0" max="300" placeholder="0">
              <span class="sub-unit">กรัม</span>
            </div>
          </div>
        </div>

        <!-- Pills: Symptoms -->
        <div class="form-row-group mt-2">
          <label class="group-label">สภาวะร่างกายขณะนี้</label>
          <div class="pills-container" id="symptom-pills">
            <button type="button" class="pill-btn active" data-val="สดชื่น">🟢 สดชื่นปกติ</button>
            <button type="button" class="pill-btn" data-val="หิวสั่น">⚡ หิวสั่น/เหงื่อแตก</button>
            <button type="button" class="pill-btn" data-val="วิงเวียน">🌀 วิงเวียน/ตาพร่า</button>
            <button type="button" class="pill-btn" data-val="เหนื่อยล้า">💤 อ่อนเพลีย</button>
          </div>
        </div>

        <!-- Additional Context -->
        <div class="form-row-group mt-2">
          <input type="text" id="food-note" class="line-input" placeholder="✍️ บันทึกอาหาร หรือกิจกรรมเสริม...">
        </div>

        <!-- Actions -->
        <div class="form-action-row">
          <button type="submit" id="submit-btn" class="submit-action-btn">
            <span class="btn-text">⚡ บันทึกจังหวะเวลานี้</span>
          </button>
          <button type="button" id="cancel-edit-btn" class="cancel-action-btn hidden">ยกเลิก</button>
        </div>
      </form>
    </section>

    <!-- Metabolic Stream (Timeline) -->
    <section class="timeline-section">
      <div class="timeline-header">
        <h2>⏱️ ไทม์ไลน์บันทึกล่าสุด</h2>
        <span id="log-counter" class="counter-badge">0 รายการ</span>
      </div>
      <div id="log-list" class="timeline-stream">
        <!-- Records injected by JS -->
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
