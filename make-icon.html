<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ดาวน์โหลด icon-512.png</title>
  <style>
    body {
      background: #0b0f19;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    canvas {
      border-radius: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      margin-bottom: 24px;
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(2,132,199,0.4);
    }
    button:hover { background: #0369a1; }
  </style>
</head>
<body>

  <h2>รูปไอคอน Metabolic Cockpit (512x512)</h2>
  <canvas id="cv" width="512" height="512"></canvas>
  <br>
  <button onclick="downloadIcon()">📥 คลิกเพื่อดาวน์โหลด icon-512.png</button>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');

    // 1. พื้นหลัง Squircle ดำลึก
    ctx.fillStyle = '#070b14';
    ctx.fillRect(0, 0, 512, 512);

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    ctx.fillStyle = '#0d1527';
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 6;
    roundRect(16, 16, 480, 480, 110);
    ctx.fill();
    ctx.stroke();

    // 2. แสง Glow กลางหน้าปัด
    const gradGlow = ctx.createRadialGradient(256, 256, 20, 256, 256, 170);
    gradGlow.addColorStop(0, 'rgba(2, 132, 199, 0.35)');
    gradGlow.addColorStop(1, 'rgba(15, 23, 42, 0)');
    ctx.fillStyle = gradGlow;
    ctx.beginPath();
    ctx.arc(256, 256, 170, 0, Math.PI * 2);
    ctx.fill();

    // 3. เส้นรอบหน้าปัดเกจ Cockpit Arc
    ctx.beginPath();
    ctx.arc(256, 250, 165, Math.PI * 0.82, Math.PI * 2.18);
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 14;
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(256, 250, 165, Math.PI * 0.82, Math.PI * 1.5);
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 14;
    ctx.stroke();

    // 4. หยดเลือดสีแดงทับทิม Minimalist
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(256, 115);
    ctx.bezierCurveTo(345, 240, 345, 335, 256, 385);
    ctx.bezierCurveTo(167, 335, 167, 240, 256, 115);
    ctx.closePath();

    const redGrad = ctx.createLinearGradient(256, 115, 256, 385);
    redGrad.addColorStop(0, '#f43f5e');
    redGrad.addColorStop(1, '#be123c');
    ctx.fillStyle = redGrad;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#9f1239';
    ctx.stroke();

    // ไฮไลต์แสงเงา
    ctx.beginPath();
    ctx.ellipse(220, 250, 14, 38, Math.PI / 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.fill();
    ctx.restore();

    // 5. คลื่นชีพจรสีขาวตัดกลาง
    const pts = [
      [125, 255], [195, 255], [218, 255], [238, 185],
      [256, 335], [274, 220], [295, 270], [318, 255], [390, 255]
    ];
    
    // เส้นเงาดำ
    ctx.beginPath();
    pts.forEach((p, i) => i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]));
    ctx.strokeStyle = '#070b14';
    ctx.lineWidth = 12;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();

    // เส้นนีออนขาว
    ctx.beginPath();
    pts.forEach((p, i) => i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]));
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 6;
    ctx.stroke();

    // จุด Pulse ฟ้าปลายคลื่น
    ctx.beginPath();
    ctx.arc(390, 255, 10, 0, Math.PI * 2);
    ctx.fillStyle = '#38bdf8';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(390, 255, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    function downloadIcon() {
      const link = document.createElement('a');
      link.download = 'icon-512.png';
      link.href = cv.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
